# docker/default.conf
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Clave para SPAs: si la ruta no matchea un archivo real,
    # siempre servir index.html y dejar que React Router resuelva el path.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache agresivo para assets con hash en el nombre (Vite los genera así:
    # main.a1b2c3d4.js) — son inmutables, seguros de cachear por mucho tiempo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # env-config.js NUNCA debe cachearse — cambia en cada deploy/restart
    # con distintas variables de entorno.
    location = /env-config.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}